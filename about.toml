# cargo-about: third-party license notices shipped with the release exe (see scripts/license-notices.sh).
targets = ["x86_64-pc-windows-msvc"]
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Bitstream-Vera",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# egui's bundled fonts: the crate's license field omits the Hack (MIT + Bitstream Vera)
# and emoji-icon-font (MIT) licenses that its font folder ships.
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND MIT AND OFL-1.1 AND Ubuntu-font-1.0 AND Bitstream-Vera"

[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
license = "OFL-1.1"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"

[[epaint_default_fonts.clarify.files]]
path = "fonts/UFL.txt"
license = "Ubuntu-font-1.0"
checksum = "2f0015108d68627bd788d313f529c21ff4da2c2c42a5e1f3883acc83480f9002"

[[epaint_default_fonts.clarify.files]]
path = "fonts/Hack-Regular.txt"
license = "MIT AND Bitstream-Vera"
checksum = "47c0cccbeec7e8614548cc485588b28149e7874188df5f41b36efebcee285c87"

[[epaint_default_fonts.clarify.files]]
path = "fonts/emoji-icon-font-mit-license.txt"
license = "MIT"
checksum = "b9d2c1d909aa149996fd4c91dcb92b2362a04431640c1d200959da94caf8cde1"
