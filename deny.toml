# cargo-deny: security advisories, license policy and dependency sources.
[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
# Defaults: fail on known vulnerabilities; unmaintained/unsound crates are reported.

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",          # fonts bundled by egui
    "Ubuntu-font-1.0",  # fonts bundled by egui
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# GUI/platform crates legitimately pull several versions of e.g. windows-sys.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
