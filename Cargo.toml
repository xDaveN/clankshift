[package]
name = "clankshift"
version = "0.1.1"
edition = "2024"
description = "Tray utility that starts your Codex and Claude 5h limits at times you choose, so resets land when you need capacity"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xDaveN/clankshift"
publish = false

[dependencies]
dirs = "7.0.0"
# Settings window only (runs in its own short-lived process). glow instead of wgpu keeps it lighter.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
# ksni = pure D-Bus tray on Linux (no GTK); ignored on Windows/macOS.
tray-icon = { version = "0.26.0", default-features = false, features = ["ksni"] }
# Same winit that eframe uses; drives the tray process event loop.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
