# release-plz keeps a release PR open with the next version + changelog (from Conventional Commits).
# Merging it tags the version and creates a draft GitHub Release; the Windows job attaches the exe and
# license notices, then publishes it. If that job fails, use "Re-run failed jobs" (re-running all jobs
# finds the tag already released and builds nothing).
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Release
    if: github.repository_owner == 'xDaveN'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: echo "tag=$(echo "${RELEASES:-[]}" | jq -r '.[0].tag // empty')" >> "$GITHUB_OUTPUT"

  release-pr:
    name: Release PR
    if: github.repository_owner == 'xDaveN'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # PRs opened with the default token do not trigger CI; RELEASE_PLZ_TOKEN (a fine-grained
          # token, see CONTRIBUTING.md) makes the required checks run on the release PR.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  windows-exe:
    name: Windows exe
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - run: cargo build --release --locked
      # .cargo/config.toml links the C runtime statically; fail rather than ship an exe needing it.
      - name: Check no VC++ runtime dependency
        run: if (Select-String -Path target/release/clankshift.exe -Pattern vcruntime -SimpleMatch -Quiet) { throw 'clankshift.exe imports the VC++ runtime' }
      # Crate, font and Rust standard library notices, from the toolchain that built the exe.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: License notices
        shell: bash
        run: bash scripts/license-notices.sh target/notices
      # Same file name every release, so updating keeps the Start with Windows entry valid.
      # --clobber lets a re-run replace assets from a partly failed upload.
      - name: Upload and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:TAG target/release/clankshift.exe target/notices/THIRD-PARTY-LICENSES.txt target/notices/RUST-LICENSES.html --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $env:TAG --draft=false
