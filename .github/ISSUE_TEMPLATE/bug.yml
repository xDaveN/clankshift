name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClankShift version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
  - type: input
    id: clis
    attributes:
      label: Provider CLI versions
      description: Output of `codex --version` and/or `claude --version`
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: From `%LOCALAPPDATA%\ClankShift\clankshift.log`. Remove anything private.
      render: text
